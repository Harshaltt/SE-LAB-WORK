<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">CreatorEscrow: UML Component Diagram (Layered Architecture)</text>

  <!-- layer bands -->
  <rect x="360" y="45" width="620" height="135" rx="6" fill="#eef4fb" stroke="#9db7d5" stroke-dasharray="6 4"/>
  <text x="372" y="66" font-size="13" font-weight="bold" fill="#3c6390">Presentation Layer</text>
  <rect x="20" y="255" width="960" height="185" rx="6" fill="#f1f8ef" stroke="#a6c99c" stroke-dasharray="6 4"/>
  <text x="32" y="276" font-size="13" font-weight="bold" fill="#4b7a3e">Business Logic Layer</text>
  <rect x="20" y="520" width="960" height="160" rx="6" fill="#fbf3e9" stroke="#d8b98f" stroke-dasharray="6 4"/>
  <text x="32" y="541" font-size="13" font-weight="bold" fill="#8a6230">Data Layer</text>

  <defs>
    <g id="icon">
      <rect x="0" y="0" width="18" height="22" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <rect x="-5" y="4" width="10" height="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <rect x="-5" y="13" width="10" height="5" fill="#fff" stroke="#333" stroke-width="1.2"/>
    </g>
  </defs>

  <g stroke="#222" stroke-width="1.6" fill="#ffffff">
    <rect x="390" y="75" width="220" height="80" rx="3"/>
    <rect x="390" y="300" width="220" height="90" rx="3"/>
    <rect x="60" y="300" width="220" height="90" rx="3"/>
    <rect x="720" y="300" width="220" height="90" rx="3"/>
    <rect x="390" y="560" width="220" height="80" rx="3"/>
  </g>
  <use href="#icon" x="582" y="82"/>
  <use href="#icon" x="582" y="307"/>
  <use href="#icon" x="252" y="307"/>
  <use href="#icon" x="912" y="307"/>
  <use href="#icon" x="582" y="567"/>

  <g text-anchor="middle" fill="#111">
    <text x="500" y="105" font-size="12" font-style="italic">«component»</text>
    <text x="500" y="126" font-size="15" font-weight="bold">Web Client UI</text>
    <text x="500" y="144" font-size="11" fill="#555">Sponsor &amp; Creator dashboards</text>

    <text x="500" y="330" font-size="12" font-style="italic">«component»</text>
    <text x="500" y="351" font-size="15" font-weight="bold">Contract &amp; Milestone</text>
    <text x="500" y="369" font-size="15" font-weight="bold">Manager</text>

    <text x="170" y="330" font-size="12" font-style="italic">«component»</text>
    <text x="170" y="351" font-size="15" font-weight="bold">Escrow Payment</text>
    <text x="170" y="369" font-size="15" font-weight="bold">Service</text>

    <text x="830" y="330" font-size="12" font-style="italic">«component»</text>
    <text x="830" y="351" font-size="15" font-weight="bold">Watermark &amp; Media</text>
    <text x="830" y="369" font-size="15" font-weight="bold">Service</text>

    <text x="500" y="590" font-size="12" font-style="italic">«component»</text>
    <text x="500" y="611" font-size="15" font-weight="bold">Contract, Ledger &amp;</text>
    <text x="500" y="629" font-size="15" font-weight="bold">Media Data Store</text>
  </g>

  <g stroke="#222" stroke-width="1.6" fill="none">
    <!-- 1. UI requires IMilestoneAPI from Contract Manager -->
    <line x1="500" y1="155" x2="500" y2="219"/>
    <path d="M484 235 A16 16 0 0 1 516 235"/>
    <line x1="500" y1="300" x2="500" y2="245"/>
    <circle cx="500" cy="235" r="10" fill="#fff"/>

    <!-- 2. Contract Manager requires IEscrowPayment from Payment Service -->
    <line x1="390" y1="345" x2="351" y2="345"/>
    <path d="M335 329 A16 16 0 0 1 335 361"/>
    <line x1="280" y1="345" x2="325" y2="345"/>
    <circle cx="335" cy="345" r="10" fill="#fff"/>

    <!-- 3. Contract Manager requires IWatermark from Watermark Service -->
    <line x1="610" y1="345" x2="649" y2="345"/>
    <path d="M665 329 A16 16 0 0 0 665 361"/>
    <line x1="720" y1="345" x2="675" y2="345"/>
    <circle cx="665" cy="345" r="10" fill="#fff"/>

    <!-- 4. Contract Manager requires IContractRepository from Data Store -->
    <line x1="500" y1="390" x2="500" y2="474"/>
    <path d="M484 490 A16 16 0 0 1 516 490"/>
    <line x1="500" y1="560" x2="500" y2="500"/>
    <circle cx="500" cy="490" r="10" fill="#fff"/>

    <!-- 5. Payment Service requires ILedgerRepository from Data Store -->
    <polyline points="170,390 170,600 304,600"/>
    <path d="M320 584 A16 16 0 0 0 320 616"/>
    <line x1="390" y1="600" x2="330" y2="600"/>
    <circle cx="320" cy="600" r="10" fill="#fff"/>

    <!-- 6. Watermark Service requires IMediaStorage from Data Store -->
    <polyline points="830,390 830,600 696,600"/>
    <path d="M680 584 A16 16 0 0 1 680 616"/>
    <line x1="610" y1="600" x2="670" y2="600"/>
    <circle cx="680" cy="600" r="10" fill="#fff"/>

  </g>

  <g font-size="12" fill="#1a1a1a">
    <text x="520" y="222" font-weight="bold">IMilestoneAPI</text>
    <text x="520" y="238" fill="#555">REST / HTTPS (JSON)</text>

    <text x="283" y="318" font-weight="bold">IEscrowPayment</text>
    <text x="290" y="384" fill="#555">API call</text>

    <text x="618" y="318" font-weight="bold">IWatermark</text>
    <text x="640" y="384" fill="#555">API call</text>

    <text x="520" y="478" font-weight="bold">IContractRepository</text>
    <text x="520" y="494" fill="#555">SQL / DB transaction</text>

    <text x="196" y="580" font-weight="bold">ILedgerRepository</text>
    <text x="196" y="634" fill="#555">SQL / DB transaction</text>

    <text x="700" y="580" font-weight="bold">IMediaStorage</text>
    <text x="700" y="634" fill="#555">Object store API</text>
  </g>


  <!-- external payment gateway (Lab 1 supporting actor) -->
  <rect x="60" y="75" width="220" height="80" rx="3" fill="#f4f4f4" stroke="#222" stroke-width="1.6" stroke-dasharray="7 4"/>
  <use href="#icon" x="252" y="82"/>
  <g text-anchor="middle" fill="#111">
    <text x="170" y="103" font-size="12" font-style="italic">«external system»</text>
    <text x="170" y="124" font-size="15" font-weight="bold">Escrow Payment</text>
    <text x="170" y="142" font-size="15" font-weight="bold">Gateway</text>
  </g>
  <g stroke="#222" stroke-width="1.6" fill="none">
    <line x1="170" y1="155" x2="170" y2="225"/>
    <circle cx="170" cy="235" r="10" fill="#fff"/>
    <path d="M154 235 A16 16 0 0 0 186 235"/>
    <line x1="170" y1="300" x2="170" y2="251"/>
  </g>
  <g font-size="12" fill="#1a1a1a">
    <text x="190" y="222" font-weight="bold">IPaymentGateway</text>
    <text x="190" y="238" fill="#555">HTTPS API (external)</text>
  </g>
  <!-- legend -->
  <g font-size="12" fill="#333">
    <circle cx="40" cy="712" r="8" fill="#fff" stroke="#222" stroke-width="1.6"/>
    <text x="56" y="716">Provided interface (ball)</text>
    <path d="M232 700 A12 12 0 0 1 232 724" fill="none" stroke="#222" stroke-width="1.6"/>
    <text x="250" y="716">Required interface (socket)</text>
    <text x="470" y="716">Solid lines = internal service calls. Dashed box = external system outside the layers.</text>
    <text x="40" y="742" fill="#666">Harsh Mannan · PES2UG24CS183 · Lab 3 · Problem Statement #53 (CreatorEscrow)</text>
  </g>
</svg>
